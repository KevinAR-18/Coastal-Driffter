<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coastal Driffter - Real-Time RTK GNSS & IMU Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-yellow: #eab308;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { margin: 0; padding: 0; background-color: var(--bg-dark); color: var(--text-main); overflow: hidden; }
    #map { height: 100vh; width: 100vw; z-index: 1; }

    #panel {
      position: absolute; top: 20px; right: 20px; z-index: 1000;
      background: var(--card-bg); backdrop-filter: blur(12px);
      padding: 24px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 350px;
      max-height: calc(100vh - 40px); overflow-y: auto;
    }

    h2 { margin: 0 0 4px 0; color: var(--accent-blue); font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .subtitle { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.5px; }

    .btn {
      width: 100%; padding: 12px; border: none; border-radius: 8px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: all 0.2s ease; margin-bottom: 10px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-primary { background: linear-gradient(135deg, #0284c7, #2563eb); color: white; box-shadow: 0 4px 12px rgba(37,99,235,0.3); }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(37,99,235,0.5); }
    
    .btn-record { background: linear-gradient(135deg, #dc2626, #b91c1c); color: white; }
    .btn-record.recording { animation: pulse 1.5s infinite; background: linear-gradient(135deg, #16a34a, #15803d); }

    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .btn-secondary { background: rgba(255,255,255,0.08); color: var(--text-main); border: 1px solid rgba(255,255,255,0.1); padding: 8px 12px; font-size: 12px; }
    .btn-secondary:hover { background: rgba(255,255,255,0.15); }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

    .badge { padding: 4px 10px; border-radius: 20px; font-weight: 700; color: white; font-size: 11px; letter-spacing: 0.5px; display: inline-block; }
    .rtk-fix { background: var(--accent-green); box-shadow: 0 0 10px rgba(34,197,94,0.4); }
    .rtk-float { background: var(--accent-yellow); color: #000; }
    .rtk-single { background: var(--accent-red); }

    .stat-section { margin-top: 14px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 12px; }
    .section-title { font-size: 12px; font-weight: 700; color: var(--accent-blue); text-transform: uppercase; margin-bottom: 8px; }

    .stat-row { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; font-size: 13px; }
    .stat-row span { color: var(--text-muted); }
    .stat-row b { color: var(--text-main); font-family: monospace; font-size: 14px; }
  </style>
</head>
<body>

  <div id="panel">
    <h2>🚤 Coastal Driffter</h2>
    <div class="subtitle">STM32 RTK GNSS & IMU Dashboard</div>

    <button id="btnConnect" class="btn btn-primary">🔌 Hubungkan ke Base (USB Serial)</button>

    <div class="btn-group">
      <button id="btnRecord" class="btn btn-record">🔴 Mulai Record</button>
      <button id="btnClear" class="btn btn-secondary">🗑️ Clear Track</button>
    </div>

    <div class="btn-group">
      <button id="btnExportCSV" class="btn btn-secondary">📥 Export CSV</button>
      <button id="btnExportGPX" class="btn btn-secondary">🗺️ Export GPX</button>
    </div>
    <button id="btnExportKML" class="btn btn-secondary" style="width: 100%; margin-bottom: 16px;">📍 Export KML (Google Earth)</button>

    <div class="stat-section">
      <div class="section-title">Status Telemetri & RTK</div>
      <div class="stat-row">
        <span>Fix Status:</span>
        <span id="txtFix" class="badge rtk-single">DISCONNECTED</span>
      </div>
      <div class="stat-row"><span>Log Points:</span><b id="txtPointCount">0 pts</b></div>
      <div class="stat-row"><span>Total Jarak:</span><b id="txtDistance">0.00 m</b></div>
    </div>

    <div class="stat-section">
      <div class="section-title">Posisi GNSS Presisi</div>
      <div class="stat-row"><span>Latitude:</span><b id="txtLat">-</b></div>
      <div class="stat-row"><span>Longitude:</span><b id="txtLon">-</b></div>
      <div class="stat-row"><span>Altitude:</span><b id="txtAlt">-</b></div>
      <div class="stat-row"><span>Akurasi (hAcc):</span><b id="txtAcc">-</b></div>
    </div>

    <div class="stat-section">
      <div class="section-title">Dinamika Pergerakan & IMU</div>
      <div class="stat-row"><span>Kecepatan:</span><b id="txtSpeed">-</b></div>
      <div class="stat-row"><span>Heading (Yaw):</span><b id="txtHeading">-</b></div>
      <div class="stat-row"><span>IMU Pitch:</span><b id="txtPitch">-</b></div>
      <div class="stat-row"><span>IMU Roll:</span><b id="txtRoll">-</b></div>
    </div>
  </div>

  <div id="map"></div>

  <script>
    // Posisi Default (Base Station)
    const basePos = [-6.17539, 106.82715];
    const map = L.map('map').setView(basePos, 18);

    // Leaflet Tile Layer (Dark Map)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 21,
      attribution: '© OpenStreetMap contributors | Coastal Driffter RTK System'
    }).addTo(map);

    // Markers & Polyline Track
    const baseMarker = L.marker(basePos).addTo(map).bindPopup('<b>📌 Base Station (Fixed Point)</b>').openPopup();
    let roverMarker = L.marker(basePos).addTo(map).bindPopup('<b>🚤 Coastal Drifter Unit</b>');
    let pathPolyline = L.polyline([], { color: '#38bdf8', weight: 4, opacity: 0.85 }).addTo(map);

    // Recording State Data
    let recordedLogs = [];
    let isRecording = false;
    let totalDistanceMeters = 0;
    let lastPosition = null;

    // Web Serial Handler
    document.getElementById('btnConnect').addEventListener('click', async () => {
      try {
        const port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });

        const decoder = new TextDecoderStream();
        port.readable.pipeTo(decoder.writable);
        const reader = decoder.readable.getReader();

        let buffer = '';
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += value;
          let lines = buffer.split('\n');
          buffer = lines.pop();

          for (let line of lines) {
            line = line.trim();
            if (line.startsWith('{') && line.endsWith('}')) {
              try {
                const data = JSON.parse(line);
                updateDashboard(data);
              } catch (e) {}
            }
          }
        }
      } catch (err) {
        alert('Gagal terhubung ke Serial: ' + err);
      }
    });

    // Haversine Distance Calculation
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000; // Earth radius in meters
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    function updateDashboard(data) {
      const lat = data.lat;
      const lon = data.lon;
      const newPos = [lat, lon];

      roverMarker.setLatLng(newPos);
      pathPolyline.addLatLng(newPos);
      map.panTo(newPos);

      // Accumulate Distance
      if (lastPosition) {
        const dist = calculateDistance(lastPosition[0], lastPosition[1], lat, lon);
        if (dist > 0.05) { // Filter micro noise
          totalDistanceMeters += dist;
        }
      }
      lastPosition = newPos;

      // Update UI Text
      document.getElementById('txtLat').innerText = lat.toFixed(7);
      document.getElementById('txtLon').innerText = lon.toFixed(7);
      document.getElementById('txtAlt').innerText = (data.alt || 0) + ' m';
      document.getElementById('txtAcc').innerText = (data.hAcc_cm || 0) + ' cm';
      document.getElementById('txtSpeed').innerText = (data.speed_kmh || 0) + ' km/h';
      document.getElementById('txtHeading').innerText = (data.heading || 0) + '°';
      document.getElementById('txtPitch').innerText = (data.pitch || 0) + '°';
      document.getElementById('txtRoll').innerText = (data.roll || 0) + '°';
      document.getElementById('txtDistance').innerText = totalDistanceMeters < 1000 ? 
        totalDistanceMeters.toFixed(2) + ' m' : (totalDistanceMeters / 1000).toFixed(2) + ' km';

      const fixElem = document.getElementById('txtFix');
      if (data.fix === 4) {
        fixElem.innerText = 'RTK FIX (1-2 cm)';
        fixElem.className = 'badge rtk-fix';
      } else if (data.fix === 5) {
        fixElem.innerText = 'RTK FLOAT (20 cm)';
        fixElem.className = 'badge rtk-float';
      } else {
        fixElem.innerText = 'SINGLE (1.5 m)';
        fixElem.className = 'badge rtk-single';
      }

      // Record Data Log
      if (isRecording) {
        recordedLogs.push({
          timestamp: new Date().toISOString(),
          lat: lat,
          lon: lon,
          alt: data.alt || 0,
          fix: data.fix || 0,
          hAcc_cm: data.hAcc_cm || 0,
          speed_kmh: data.speed_kmh || 0,
          heading: data.heading || 0,
          pitch: data.pitch || 0,
          roll: data.roll || 0
        });
        document.getElementById('txtPointCount').innerText = recordedLogs.length + ' pts';
      }
    }

    // Recording Controls
    const btnRecord = document.getElementById('btnRecord');
    btnRecord.addEventListener('click', () => {
      isRecording = !isRecording;
      if (isRecording) {
        btnRecord.innerText = '⏹️ Stop Recording';
        btnRecord.classList.add('recording');
      } else {
        btnRecord.innerText = '🔴 Mulai Record';
        btnRecord.classList.remove('recording');
      }
    });

    document.getElementById('btnClear').addEventListener('click', () => {
      if (confirm('Bersihkan lintasan peta dan data log terrekam?')) {
        pathPolyline.setLatLngs([]);
        recordedLogs = [];
        totalDistanceMeters = 0;
        lastPosition = null;
        document.getElementById('txtPointCount').innerText = '0 pts';
        document.getElementById('txtDistance').innerText = '0.00 m';
      }
    });

    // Helper Download File
    function downloadFile(content, fileName, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      a.click();
      URL.revokeObjectURL(url);
    }

    // CSV Exporter
    document.getElementById('btnExportCSV').addEventListener('click', () => {
      if (recordedLogs.length === 0) return alert('Belum ada data log terrekam!');
      let csv = 'Timestamp,Latitude,Longitude,Altitude_m,Fix_Status,hAcc_cm,Speed_kmh,Heading_deg,Pitch_deg,Roll_deg\n';
      recordedLogs.forEach(r => {
        csv += `${r.timestamp},${r.lat},${r.lon},${r.alt},${r.fix},${r.hAcc_cm},${r.speed_kmh},${r.heading},${r.pitch},${r.roll}\n`;
      });
      downloadFile(csv, `Coastal_Driffter_Log_${Date.now()}.csv`, 'text/csv');
    });

    // GPX Exporter
    document.getElementById('btnExportGPX').addEventListener('click', () => {
      if (recordedLogs.length === 0) return alert('Belum ada data log terrekam!');
      let gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Coastal Driffter Dashboard" xmlns="http://www.topografix.com/GPX/1/1">
  <trk>
    <name>Coastal Driffter Track</name>
    <trkseg>\n`;
      recordedLogs.forEach(r => {
        gpx += `      <trkpt lat="${r.lat}" lon="${r.lon}">
        <ele>${r.alt}</ele>
        <time>${r.timestamp}</time>
      </trkpt>\n`;
      });
      gpx += `    </trkseg>
  </trk>
</gpx>`;
      downloadFile(gpx, `Coastal_Driffter_Track_${Date.now()}.gpx`, 'application/gpx+xml');
    });

    // KML Exporter
    document.getElementById('btnExportKML').addEventListener('click', () => {
      if (recordedLogs.length === 0) return alert('Belum ada data log terrekam!');
      let coordsStr = recordedLogs.map(r => `${r.lon},${r.lat},${r.alt}`).join(' ');
      let kml = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>Coastal Driffter Track</name>
    <Style id="redLine">
      <LineStyle><color>ff00c6ff</color><width>4</width></LineStyle>
    </Style>
    <Placemark>
      <name>Trajectory Path</name>
      <styleUrl>#redLine</styleUrl>
      <LineString>
        <coordinates>${coordsStr}</coordinates>
      </LineString>
    </Placemark>
  </Document>
</kml>`;
      downloadFile(kml, `Coastal_Driffter_Track_${Date.now()}.kml`, 'application/vnd.google-earth.kml+xml');
    });
  </script>
</body>
</html>
